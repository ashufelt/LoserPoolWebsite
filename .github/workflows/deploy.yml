name: deploy

# Deploys on green master only. The test job is a hard gate: a red suite
# should not reach players mid-season.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Requires a FLY_API_TOKEN repository secret, created with:
      #   fly tokens create deploy --app loser-pool-2026
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy that returns 200 but cannot reach ESPN, or cannot write its
      # database, is a broken season rather than a broken page -- so fail here
      # rather than find out in November.
      - name: Verify the deployment is actually healthy
        run: |
          sleep 10
          body=$(curl -sS --max-time 60 https://loser-pool-2026.fly.dev/health.php)
          echo "$body"
          echo "$body" | grep -q "Status         OK" || { echo "health check reported a problem"; exit 1; }
